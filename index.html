<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244a35"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Durian Farm">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Durian Farm Manager</title>
<style>
:root{--g:#244a35;--l:#548235;--p:#e2f0d9;--bg:#f4f7f2;--ink:#1d2b22}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:85px}
header{background:var(--g);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:3}
h1{font-size:20px;margin:0 0 4px}header small{color:#d9e7dc}
main{padding:14px;max-width:760px;margin:auto}.hero{background:var(--g);color:white;border-radius:18px;padding:18px;margin-bottom:14px}.hero h2{margin:7px 0;font-size:22px}.muted{color:#637267;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border-radius:15px;padding:14px;box-shadow:0 1px 4px #16301b12;margin-bottom:10px}.metric b{display:block;font-size:20px;margin:8px 0}.metric span{font-size:13px;color:#66756b}
button,.btn{border:0;border-radius:11px;background:var(--l);color:white;padding:11px 14px;font-weight:650;font-size:14px;cursor:pointer}.btn2{background:#eaf1e7;color:var(--g)}.danger{background:#fbe9e7;color:#a12d22}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce5dc;display:flex;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:4}
nav button{background:transparent;color:#607064;padding:7px 4px;min-width:50px;font-size:11px}nav button.active{color:var(--g);background:var(--p)}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d5dfd6;border-radius:10px;background:white;font:inherit;color:var(--ink)}textarea{min-height:70px}
form{background:white;padding:14px;border-radius:15px;margin:12px 0}form button{margin-top:12px;width:100%}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #edf1ed;padding:10px 0}.item:last-child{border:0}.item strong{display:block}.tag{font-size:11px;background:var(--p);color:var(--g);border-radius:20px;padding:4px 8px;white-space:nowrap}
.hidden{display:none!important}.photo{width:100%;max-height:230px;object-fit:cover;border-radius:10px;margin-top:8px}.notice{background:#fff8df;padding:12px;border-radius:12px;font-size:13px;color:#68551d}
h3{margin:6px 0 12px}.empty{padding:22px;text-align:center;color:#718075}
</style>
</head>
<body>
<header><h1>🌱 Durian Farm Manager</h1><small>Sistem Pengurusan Kebun Durian</small></header>
<main id="app"></main>
<nav id="nav">
<button data-tab="home" class="active">🏡<br>Utama</button>
<button data-tab="trees">🌳<br>Pokok</button>
<button data-tab="inputs">🧪<br>Baja/Racun</button>
<button data-tab="money">💰<br>Kewangan</button>
<button data-tab="photos">📷<br>Foto</button>
<button data-tab="tasks">📅<br>Jadual</button>
<button data-tab="backup">💾<br>Sandaran</button>
</nav>
<script src="app.js"></script>
</body></html>
